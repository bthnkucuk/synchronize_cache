name: offline_first_sync_drift
description: >
  Offline-first synchronization library for Dart/Flutter built on Drift.
  Features conflict resolution, outbox pattern, and incremental sync.
version: 0.2.0
repository: https://github.com/cherrypick-agency/offline_first_sync_drift
issue_tracker: https://github.com/cherrypick-agency/offline_first_sync_drift/issues
resolution: workspace

topics:
  - drift
  - offline-first
  - sync
  - database
  - cache

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.35.0
  meta: ^1.16.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5
  test: ^1.31.1
