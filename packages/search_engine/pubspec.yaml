  cursor-based incremental indexing, and a swappable transport layer.
version: 0.2.1
repository: https://github.com/cherrypick-agency/synchronize_cache
issue_tracker: https://github.com/cherrypick-agency/synchronize_cache/issues
resolution: workspace

topics:
  - drift
  - fts5
  - search
  - sqlite

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.35.0
  meta: ^1.16.0
  rxdart: ^0.28.0
  synchronized: ^3.4.2

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5
  test: ^1.31.1
