name: todo_advanced_frontend
description: Advanced TODO app demonstrating offline_first_sync_drift with conflict resolution
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  offline_first_sync_drift:
    path: ../../../packages/offline_first_sync_drift
  offline_first_sync_drift_rest:
    path: ../../../packages/offline_first_sync_drift_rest
  # Global full-text search over every kind (FTS5 + trigram, in the bundled
  # sqlite3.wasm as well).
  search_engine:
    path: ../../../packages/search_engine
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  provider: ^6.1.5+1
  http: ^1.6.0
  # The live change feed: one implementation for the browser and the VM.
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
